# Place limit_req_zone in the http context. Replace domain and TLS certificate paths.
limit_req_zone $binary_remote_addr zone=schedule_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=schedule_guest:10m rate=2r/s;

server {
    listen 80;
    server_name schedule.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name schedule.example.org;
    ssl_certificate /etc/letsencrypt/live/schedule.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schedule.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;
    client_body_timeout 10s;

    location ^~ /api/v1/auth/guest {
        limit_req zone=schedule_api burst=40 nodelay;
        limit_req zone=schedule_guest burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8186;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=schedule_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8186;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
